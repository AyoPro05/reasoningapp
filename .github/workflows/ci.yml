name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://reasoningapp:ci-test-only@127.0.0.1:55432/reasoningapp_integration
      REDIS_URL: redis://127.0.0.1:6379/1
      AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
      AUTH_SECRET: ci-test-only-secret-never-use-in-production-123456
      MAIL_PROVIDER: fake
      DEVELOPMENT_FIXTURES_ENABLED: 'false'
      SKIP_EMAIL_VERIFICATION: 'false'
      SEED_VERIFIED_USERS: 'false'
      ALLOW_UNREVIEWED_CONTENT: 'false'
      AI_ASSISTANCE_ENABLED: 'false'
      LIVE_BILLING_ENABLED: 'false'
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: reasoningapp
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: reasoningapp_integration
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U reasoningapp -d reasoningapp_integration"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.2.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Generate the pinned Prisma client before source checks
        run: pnpm --filter @reasoningapp/database db:generate
      - name: Deploy database migrations before database-backed security checks
        run: pnpm --filter @reasoningapp/database db:deploy
      - run: pnpm test
      - run: pnpm typecheck
      - name: Compile shared packages, API and worker (client applications are later tasks)
        run: pnpm build
      - run: docker compose -f infra/compose.yaml config --quiet
      - name: Run real database integration checks with explicit test-only content
        env:
          DEVELOPMENT_FIXTURES_ENABLED: 'true'
          ALLOW_UNREVIEWED_CONTENT: 'true'
          RUN_REDIS_INTEGRATION: 'true'
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: pnpm test:integration
